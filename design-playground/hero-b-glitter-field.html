<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero B: Glitter Field — Dina Dynamics</title>
    <link rel="stylesheet" href="playground-foundation.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hero-content {
            text-align: center;
            max-width: 900px;
            padding: 0 2rem;
        }

        .hero-logo {
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2.5rem;
            color: var(--accent-primary);
            opacity: 0.9;
            animation: fadeInDown 1.2s ease-out;
        }

        .hero-title {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -2.5px;
            line-height: 1;
            margin-bottom: 1.5rem;
            color: var(--brand-silver);
            text-shadow: 0 0 60px rgba(192, 192, 192, 0.3),
                        0 20px 80px rgba(0, 123, 255, 0.2);
            animation: fadeInUp 1.4s ease-out 0.2s both;
        }

        .hero-subtitle {
            font-size: 1.4rem;
            color: var(--accent-light);
            margin-bottom: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            animation: fadeInUp 1.4s ease-out 0.4s both;
        }

        .hero-cta {
            pointer-events: auto;
            padding: 1.3rem 3.5rem;
            font-size: 0.95rem;
            font-weight: 700;
            border: 2px solid var(--accent-primary);
            background: rgba(0, 123, 255, 0.08);
            color: var(--accent-primary);
            cursor: pointer;
            transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            border-radius: 2px;
            animation: fadeInUp 1.4s ease-out 0.6s both;
        }

        .hero-cta:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 40px rgba(0, 123, 255, 0.7),
                       inset 0 0 20px rgba(0, 123, 255, 0.3);
            transform: translateY(-3px) scale(1.05);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-top {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            pointer-events: auto;
        }

        .nav-top a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 200ms ease;
        }

        .nav-top a:hover {
            color: var(--accent-primary);
        }

        .theme-switcher {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10000;
            background: rgba(10, 26, 48, 0.9);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1rem;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }

        .theme-switcher label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }

        .theme-switcher select {
            width: 100%;
            background: var(--accent-deep);
            color: var(--text-primary);
            border: 1px solid var(--accent-primary);
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .theme-switcher select:hover {
            background: var(--accent-primary);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 3rem;
            }

            .hero-subtitle {
                font-size: 1.1rem;
            }

            .hero-logo {
                font-size: 0.9rem;
            }

            .hero-cta {
                padding: 1rem 2.5rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Hero Overlay Content -->
    <div class="hero-overlay">
        <div class="hero-content">
            <div class="hero-logo">Dina Dynamics</div>
            <h1 class="hero-title">Maritime Autonomy</h1>
            <p class="hero-subtitle">Defense. Strategy. Precision.</p>
            <button class="hero-cta">Start Exploration</button>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-top">
        <a href="material-playground.html">← Material Lab</a>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <label for="theme-switcher">Theme</label>
        <select id="theme-switcher">
            <option value="electric-cobalt" selected>Electric Cobalt</option>
            <option value="imperial-sapphire">Imperial Sapphire</option>
            <option value="arctic-steel">Arctic Steel</option>
            <option value="deep-atlantic">Deep Atlantic</option>
            <option value="midnight-titanium">Midnight Titanium</option>
        </select>
    </div>

    <!-- Three.js and Scripts -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js';
        import { applyTheme, getCurrentTheme, hexToRGBNormalized } from './theme-config.js';

        // Apply default theme
        applyTheme('electric-cobalt');

        /**
         * Hero B: Glitter Field Animation
         * Particle system with parallax and responsive motion
         */
        class GlitterFieldHero {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.updateSceneColors();
                this.setupLighting();
                this.createGlitterField();
                this.setupEventListeners();

                this.mouseX = 0;
                this.mouseY = 0;
                this.time = 0;

                this.animate();
            }

            updateSceneColors() {
                const theme = getCurrentTheme();
                this.scene.background = new THREE.Color(theme.darkBg);
                this.scene.fog = new THREE.Fog(theme.darkBg, 150, 1000);
            }

            setupLighting() {
                const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.6);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0x70B9FF, 0.8);
                directionalLight.position.set(10, 10, 10);
                this.scene.add(directionalLight);

                const pointLight = new THREE.PointLight(0x007BFF, 1.0);
                pointLight.position.set(0, 0, 10);
                this.scene.add(pointLight);
            }

            createGlitterField() {
                const particleCount = 1500;
                const geometry = new THREE.BufferGeometry();

                const positions = new Float32Array(particleCount * 3);
                const velocities = new Float32Array(particleCount * 3);
                const sizes = new Float32Array(particleCount);
                const colors = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    // Position
                    positions[i * 3] = (Math.random() - 0.5) * 20;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

                    // Velocity
                    velocities[i * 3] = (Math.random() - 0.5) * 0.05;
                    velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.05;
                    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.05;

                    // Size
                    sizes[i] = Math.random() * 0.5 + 0.1;

                    // Color - mix of silver and accent
                    const isAccent = Math.random() > 0.7;
                    if (isAccent) {
                        const accentRGB = hexToRGBNormalized('#007BFF');
                        colors[i * 3] = accentRGB.r;
                        colors[i * 3 + 1] = accentRGB.g;
                        colors[i * 3 + 2] = accentRGB.b;
                    } else {
                        colors[i * 3] = 0.75 + Math.random() * 0.25;
                        colors[i * 3 + 1] = 0.75 + Math.random() * 0.25;
                        colors[i * 3 + 2] = 0.75 + Math.random() * 0.25;
                    }
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const canvas = this.createGlitterTexture();
                const texture = new THREE.CanvasTexture(canvas);

                const material = new THREE.PointsMaterial({
                    size: 0.1,
                    map: texture,
                    sizeAttenuation: true,
                    transparent: true,
                    vertexColors: true,
                    fog: true
                });

                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);

                // Store references for animation
                this.particlePositions = positions;
                this.particleVelocities = velocities;
            }

            createGlitterTexture() {
                const size = 64;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // Radial gradient for particle
                const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);

                return canvas;
            }

            animateParticles() {
                const positions = this.particles.geometry.attributes.position.array;
                const velocities = this.particleVelocities;

                for (let i = 0; i < positions.length; i += 3) {
                    // Update position
                    positions[i] += velocities[i];
                    positions[i + 1] += velocities[i + 1];
                    positions[i + 2] += velocities[i + 2];

                    // Wrap around
                    if (positions[i] > 10) positions[i] = -10;
                    if (positions[i] < -10) positions[i] = 10;
                    if (positions[i + 1] > 10) positions[i + 1] = -10;
                    if (positions[i + 1] < -10) positions[i + 1] = 10;
                    if (positions[i + 2] > 10) positions[i + 2] = -10;
                    if (positions[i + 2] < -10) positions[i + 2] = 10;

                    // Add mouse influence
                    const influence = Math.sin(this.time + i * 0.1) * 0.01;
                    velocities[i] += influence * this.mouseX;
                    velocities[i + 1] += influence * this.mouseY;

                    // Dampen velocity
                    velocities[i] *= 0.99;
                    velocities[i + 1] *= 0.99;
                    velocities[i + 2] *= 0.99;
                }

                this.particles.geometry.attributes.position.needsUpdate = true;
            }

            setupEventListeners() {
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                });

                window.addEventListener('resize', () => this.onWindowResize());

                document.getElementById('theme-switcher').addEventListener('change', (e) => {
                    applyTheme(e.target.value);
                    this.updateSceneColors();
                });
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate = () => {
                requestAnimationFrame(this.animate);
                this.time += 0.016;

                this.particles.rotation.x += 0.0001;
                this.particles.rotation.y += 0.0003;

                this.animateParticles();

                this.renderer.render(this.scene, this.camera);
            };
        }

        // Initialize
        const hero = new GlitterFieldHero();
    </script>
</body>
</html>
