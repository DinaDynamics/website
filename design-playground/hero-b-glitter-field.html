<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero B: Glitter Field — Dina Dynamics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #050F20;
            color: #FFFFFF;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-panel {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            background: rgba(5, 15, 32, 0.95);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
            min-width: 280px;
        }

        .ui-panel h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #007BFF;
        }

        .nav-back {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            padding: 0.75rem 1.5rem;
            background: rgba(192, 192, 192, 0.1);
            border: 1px solid rgba(192, 192, 192, 0.3);
            color: #A7C7E7;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .nav-back:hover {
            background: rgba(192, 192, 192, 0.2);
            border-color: rgba(192, 192, 192, 0.5);
            color: #C0C0C0;
        }

        .info-panel {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            background: rgba(5, 15, 32, 0.95);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            max-width: 320px;
            font-size: 0.85rem;
        }

        .info-panel p {
            margin-bottom: 0.5rem;
            color: #A7C7E7;
            line-height: 1.4;
        }

        .info-panel strong {
            color: #007BFF;
            display: block;
            margin-top: 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1024px) {
            .ui-panel {
                top: auto;
                right: auto;
                bottom: 2rem;
                left: 2rem;
                min-width: 100%;
                max-width: 400px;
            }

            .info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Navigation -->
    <a href="index.html" class="nav-back">← Back to Playground</a>

    <!-- UI Panel (lil-gui will mount here) -->
    <div class="ui-panel" id="ui-container"></div>

    <!-- Info Panel -->
    <div class="info-panel">
        <p><strong>Hero B: Glitter Field</strong></p>
        <p>1500+ particle instances with individual physics and responsive parallax. Move mouse to influence particle trajectories.</p>
        <p><strong>Features:</strong> Instanced particles, parallax depth, responsive lighting, dense glitter material.</p>
    </div>

    <!-- Three.js and Dependencies -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@r170",
        "three/addons/": "https://esm.sh/three@r170/examples/jsm/",
        "lil-gui": "https://esm.sh/lil-gui@0.20.0"
      }
    }
    </script>

    <!-- Main Application -->
    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'lil-gui';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { PMREMGenerator } from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const config = {
            theme: 'electric-cobalt',
            particleCount: 1500,
            parallaxIntensity: 0.5,
            animationSpeed: 1.0,
            bloomIntensity: 1.5,
            bloomThreshold: 0.7,
            bloomScale: 0.5
        };

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, canvas });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        camera.position.set(0, 0, 10);
        scene.background = new THREE.Color('#050F20');

        // Environment
        const pmremGenerator = new PMREMGenerator(renderer);
        const environment = new RoomEnvironment();
        const envMap = pmremGenerator.fromScene(environment).texture;
        scene.environment = envMap;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x1a2a4a, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x007BFF, 1.0);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Particles
        const particleCount = config.particleCount;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        
        const particles = [];

        for (let i = 0; i < particleCount; i++) {
            const x = (Math.random() - 0.5) * 30;
            const y = (Math.random() - 0.5) * 30;
            const z = (Math.random() - 0.5) * 20;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            const isSilver = Math.random() > 0.3;
            if (isSilver) {
                colors[i * 3] = 0.75;
                colors[i * 3 + 1] = 0.75;
                colors[i * 3 + 2] = 0.75;
            } else {
                colors[i * 3] = 0.0;
                colors[i * 3 + 1] = 0.47;
                colors[i * 3 + 2] = 1.0;
            }

            sizes[i] = Math.random() * 2 + 1;

            particles.push({
                x, y, z,
                vx: (Math.random() - 0.5) * 0.05,
                vy: (Math.random() - 0.5) * 0.05 - 0.01,
                vz: (Math.random() - 0.5) * 0.05
            });
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: 0.5,
            sizeAttenuation: true,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            emissive: '#007BFF',
            emissiveIntensity: 0.5
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // Mouse tracking
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Post-processing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            config.bloomIntensity,
            config.bloomScale,
            config.bloomThreshold
        );
        composer.addPass(bloomPass);

        // GUI
        const gui = new GUI({ container: document.getElementById('ui-container') });
        gui.title('Hero B: Glitter Field');

        const controlFolder = gui.addFolder('Particle Motion');
        controlFolder.add(config, 'parallaxIntensity', 0, 1, 0.1);
        controlFolder.add(config, 'animationSpeed', 0, 2, 0.1);

        const bloomFolder = gui.addFolder('Post-Processing');
        bloomFolder.add(config, 'bloomIntensity', 0, 5, 0.1).onChange((v) => {
            bloomPass.strength = v;
        });
        bloomFolder.add(config, 'bloomThreshold', 0, 1, 0.05).onChange((v) => {
            bloomPass.threshold = v;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const posAttr = geometry.getAttribute('position');
            const posArray = posAttr.array;

            for (let i = 0; i < particleCount; i++) {
                const p = particles[i];

                // Apply velocity
                p.x += p.vx * config.animationSpeed;
                p.y += p.vy * config.animationSpeed;
                p.z += p.vz * config.animationSpeed;

                // Mouse influence
                const dx = mouseX * 10 - p.x;
                const dy = mouseY * 10 - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 5) {
                    p.vx += (dx / dist * 0.001) * config.parallaxIntensity;
                    p.vy += (dy / dist * 0.001) * config.parallaxIntensity;
                }

                // Damping
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.vz *= 0.98;

                // Wrapping
                if (p.x > 15) p.x = -15;
                if (p.x < -15) p.x = 15;
                if (p.y > 15) p.y = -15;
                if (p.y < -15) p.y = 15;

                posArray[i * 3] = p.x;
                posArray[i * 3 + 1] = p.y;
                posArray[i * 3 + 2] = p.z;
            }

            posAttr.needsUpdate = true;
            points.rotation.z += 0.00005;

            composer.render();
        }

        animate();
    </script>
</body>
</html>
