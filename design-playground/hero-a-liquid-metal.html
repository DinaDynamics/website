<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero A: Liquid Metal — Dina Dynamics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #050F20;
            color: #FFFFFF;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-panel {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            background: rgba(5, 15, 32, 0.95);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
            min-width: 280px;
        }

        .ui-panel h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #007BFF;
        }

        .nav-back {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            padding: 0.75rem 1.5rem;
            background: rgba(192, 192, 192, 0.1);
            border: 1px solid rgba(192, 192, 192, 0.3);
            color: #A7C7E7;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .nav-back:hover {
            background: rgba(192, 192, 192, 0.2);
            border-color: rgba(192, 192, 192, 0.5);
            color: #C0C0C0;
        }

        .info-panel {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            background: rgba(5, 15, 32, 0.95);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            max-width: 320px;
            font-size: 0.85rem;
        }

        .info-panel p {
            margin-bottom: 0.5rem;
            color: #A7C7E7;
            line-height: 1.4;
        }

        .info-panel strong {
            color: #007BFF;
            display: block;
            margin-top: 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1024px) {
            .ui-panel {
                top: auto;
                right: auto;
                bottom: 2rem;
                left: 2rem;
                min-width: 100%;
                max-width: 400px;
            }

            .info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Navigation -->
    <a href="index.html" class="nav-back">← Back to Playground</a>

    <!-- UI Panel (lil-gui will mount here) -->
    <div class="ui-panel" id="ui-container"></div>

    <!-- Info Panel -->
    <div class="info-panel">
        <p><strong>Hero A: Liquid Metal</strong></p>
        <p>Responsive morphing mesh that deforms with cursor movement. Click and drag to rotate. Scroll to zoom.</p>
        <p><strong>Features:</strong> PBR metallic material, realistic reflections, responsive deformation, cinematic lighting.</p>
    </div>

    <!-- Three.js and Dependencies -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@r170",
        "three/addons/": "https://esm.sh/three@r170/examples/jsm/",
        "lil-gui": "https://esm.sh/lil-gui@0.20.0"
      }
    }
    </script>

    <!-- Main Application -->
    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'lil-gui';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { PMREMGenerator } from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const config = {
            theme: 'electric-cobalt',
            metalness: 1.0,
            roughness: 0.12,
            clearcoat: 0.95,
            clearcoatRoughness: 0.08,
            parallaxIntensity: 0.5,
            cameraDistance: 6,
            lightIntensity: 1.5,
            ambientIntensity: 0.3,
            autoRotate: false,
            rotationSpeed: 0.3,
            bloomIntensity: 1.2,
            bloomThreshold: 0.9,
            bloomScale: 0.4
        };

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, canvas });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        camera.position.set(0, 0, config.cameraDistance);
        scene.background = new THREE.Color('#050F20');

        // Environment
        const pmremGenerator = new PMREMGenerator(renderer);
        const environment = new RoomEnvironment();
        const envMap = pmremGenerator.fromScene(environment).texture;
        scene.environment = envMap;

        // Lighting
        const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.5);
        keyLight.position.set(5, 10, 7);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x70B9FF, 0.8);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const ambientLight = new THREE.AmbientLight(0x1a2a4a, 0.3);
        scene.add(ambientLight);

        // Mesh
        const geometry = new THREE.IcosahedronGeometry(2, 32);
        const positionAttribute = geometry.getAttribute('position');
        const originalPositions = new Float32Array(positionAttribute.array);
        
        const material = new THREE.MeshPhysicalMaterial({
            color: '#C0C0C0',
            metalness: config.metalness,
            roughness: config.roughness,
            clearcoat: config.clearcoat,
            clearcoatRoughness: config.clearcoatRoughness,
            envMapIntensity: 1.5
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Deformation on mouse move
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = config.autoRotate;
        controls.autoRotateSpeed = config.rotationSpeed;

        // Post-processing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            config.bloomIntensity,
            config.bloomScale,
            config.bloomThreshold
        );
        composer.addPass(bloomPass);

        // GUI
        const gui = new GUI({ container: document.getElementById('ui-container') });
        gui.title('Hero A: Liquid Metal');

        const matFolder = gui.addFolder('Material Properties');
        matFolder.add(config, 'metalness', 0, 1, 0.01).onChange((v) => {
            material.metalness = v;
        });
        matFolder.add(config, 'roughness', 0, 1, 0.01).onChange((v) => {
            material.roughness = v;
        });
        matFolder.add(config, 'clearcoat', 0, 1, 0.01).onChange((v) => {
            material.clearcoat = v;
        });
        matFolder.add(config, 'clearcoatRoughness', 0, 1, 0.01).onChange((v) => {
            material.clearcoatRoughness = v;
        });

        const controlFolder = gui.addFolder('Controls');
        controlFolder.add(config, 'parallaxIntensity', 0, 1, 0.1);
        controlFolder.add(config, 'cameraDistance', 2, 15, 0.1).onChange((v) => {
            camera.position.z = v;
        });
        controlFolder.add(config, 'autoRotate').onChange((v) => {
            controls.autoRotate = v;
        });

        const lightFolder = gui.addFolder('Lighting');
        lightFolder.add(config, 'lightIntensity', 0, 3, 0.1).onChange((v) => {
            keyLight.intensity = v;
        });
        lightFolder.add(config, 'ambientIntensity', 0, 1, 0.05).onChange((v) => {
            ambientLight.intensity = v;
        });

        const bloomFolder = gui.addFolder('Post-Processing');
        bloomFolder.add(config, 'bloomIntensity', 0, 5, 0.1).onChange((v) => {
            bloomPass.strength = v;
        });
        bloomFolder.add(config, 'bloomThreshold', 0, 1, 0.05).onChange((v) => {
            bloomPass.threshold = v;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Deform mesh based on mouse
            const positions = geometry.getAttribute('position');
            for (let i = 0; i < positionAttribute.count; i++) {
                const x = originalPositions[i * 3];
                const y = originalPositions[i * 3 + 1];
                const z = originalPositions[i * 3 + 2];
                
                const deformation = (Math.sin(Date.now() * 0.0005 + x) + Math.cos(Date.now() * 0.0007 + y)) * 0.05;
                const mouseInfluence = (mouseX * x + mouseY * y) * 0.02 * config.parallaxIntensity;
                
                positions.setXYZ(i, x + mouseInfluence + deformation, y + deformation, z + mouseInfluence);
            }
            positions.needsUpdate = true;

            mesh.rotation.x += 0.0005;
            mesh.rotation.y += 0.0008;

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
