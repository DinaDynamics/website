<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero A: Liquid Metal — Dina Dynamics</title>
    <link rel="stylesheet" href="playground-foundation.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hero-content {
            text-align: center;
            max-width: 800px;
        }

        .hero-logo {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--accent-primary);
            text-shadow: 0 0 20px rgba(0, 123, 255, 0.4);
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 1.5rem;
            color: var(--brand-silver);
            text-shadow: 0 20px 60px rgba(0, 123, 255, 0.3),
                        0 0 40px rgba(192, 192, 192, 0.2);
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--accent-light);
            margin-bottom: 3rem;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(0, 123, 255, 0.2);
        }

        .hero-cta {
            pointer-events: auto;
            padding: 1.2rem 3rem;
            font-size: 0.95rem;
            font-weight: 700;
            border: 2px solid var(--accent-primary);
            background: rgba(0, 123, 255, 0.1);
            color: var(--accent-primary);
            cursor: pointer;
            transition: all 300ms ease-out;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            border-radius: 2px;
        }

        .hero-cta:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.6);
            transform: translateY(-2px);
        }

        .nav-top {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            pointer-events: auto;
        }

        .nav-top a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 200ms ease;
        }

        .nav-top a:hover {
            color: var(--accent-primary);
        }

        .theme-switcher {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10000;
            background: rgba(10, 26, 48, 0.8);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1rem;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }

        .theme-switcher label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }

        .theme-switcher select {
            width: 100%;
            background: var(--accent-deep);
            color: var(--text-primary);
            border: 1px solid var(--accent-primary);
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .theme-switcher select:hover {
            background: var(--accent-primary);
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .hero-logo {
                font-size: 0.95rem;
            }

            .hero-cta {
                padding: 1rem 2rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Hero Overlay Content -->
    <div class="hero-overlay">
        <div class="hero-content">
            <div class="hero-logo">Dina Dynamics</div>
            <h1 class="hero-title">Advanced Maritime Autonomy</h1>
            <p class="hero-subtitle">Precision. Defense. Autonomy.</p>
            <button class="hero-cta">Explore Platform</button>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-top">
        <a href="material-playground.html">← Material Lab</a>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <label for="theme-switcher">Theme</label>
        <select id="theme-switcher">
            <option value="electric-cobalt" selected>Electric Cobalt</option>
            <option value="imperial-sapphire">Imperial Sapphire</option>
            <option value="arctic-steel">Arctic Steel</option>
            <option value="deep-atlantic">Deep Atlantic</option>
            <option value="midnight-titanium">Midnight Titanium</option>
        </select>
    </div>

    <!-- Three.js and Scripts -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js';
        import { applyTheme, getCurrentTheme, THEMES } from './theme-config.js';

        // Apply default theme
        applyTheme('electric-cobalt');

        /**
         * Hero A: Liquid Metal Morphing
         * Full-screen mesh that responds to mouse movement with wave distortion
         */
        class LiquidMetalHero {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.updateSceneColors();
                this.setupLighting();
                this.createLiquidMesh();
                this.setupEventListeners();

                this.mouseX = 0;
                this.mouseY = 0;
                this.time = 0;

                this.animate();
            }

            updateSceneColors() {
                const theme = getCurrentTheme();
                this.scene.background = new THREE.Color(theme.darkBg);
                this.scene.fog = new THREE.Fog(theme.darkBg, 100, 1000);
            }

            setupLighting() {
                const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.4);
                keyLight.position.set(8, 12, 8);
                this.scene.add(keyLight);

                const fillLight = new THREE.DirectionalLight(0x70B9FF, 0.6);
                fillLight.position.set(-8, 5, -8);
                this.scene.add(fillLight);

                const ambientLight = new THREE.AmbientLight(0x1a2a4a, 0.5);
                this.scene.add(ambientLight);

                const rimLight = new THREE.PointLight(0x007BFF, 1.2);
                rimLight.position.set(0, 0, 10);
                this.scene.add(rimLight);
            }

            createLiquidMesh() {
                const geometry = new THREE.IcosahedronGeometry(3, 32);
                
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(getCurrentTheme().silver),
                    metalness: 1.0,
                    roughness: 0.15,
                    envMapIntensity: 1.2
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;

                // Store original positions for wave deformation
                this.originalPositions = new Float32Array(geometry.attributes.position.array);
                
                this.scene.add(this.mesh);
            }

            setupEventListeners() {
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                });

                window.addEventListener('resize', () => this.onWindowResize());

                document.getElementById('theme-switcher').addEventListener('change', (e) => {
                    applyTheme(e.target.value);
                    this.updateSceneColors();
                    
                    // Update material color
                    const theme = getCurrentTheme();
                    this.mesh.material.color.set(theme.silver);
                });
            }

            deformMesh() {
                const positions = this.mesh.geometry.attributes.position;
                const count = positions.count;

                for (let i = 0; i < count; i++) {
                    const x = this.originalPositions[i * 3];
                    const y = this.originalPositions[i * 3 + 1];
                    const z = this.originalPositions[i * 3 + 2];

                    // Wave deformation based on mouse and time
                    const influence = Math.sin(this.time + i * 0.1) * 0.3;
                    const mouseInfluence = (this.mouseX + this.mouseY) * 0.1;

                    positions.setXYZ(
                        i,
                        x * (1 + influence * 0.1 + mouseInfluence * 0.05),
                        y * (1 + influence * 0.1 + mouseInfluence * 0.05),
                        z * (1 + influence * 0.1 + mouseInfluence * 0.05)
                    );
                }

                positions.needsUpdate = true;
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate = () => {
                requestAnimationFrame(this.animate);
                this.time += 0.016;

                this.mesh.rotation.x += 0.0005;
                this.mesh.rotation.y += 0.0008;

                this.deformMesh();

                this.renderer.render(this.scene, this.camera);
            };
        }

        // Initialize
        const hero = new LiquidMetalHero();
    </script>
</body>
</html>
