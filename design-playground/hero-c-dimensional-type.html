<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero C: Dimensional Type — Dina Dynamics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #050F20;
            color: #FFFFFF;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-panel {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            background: rgba(5, 15, 32, 0.95);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
            min-width: 280px;
        }

        .ui-panel h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #007BFF;
        }

        .nav-back {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            padding: 0.75rem 1.5rem;
            background: rgba(192, 192, 192, 0.1);
            border: 1px solid rgba(192, 192, 192, 0.3);
            color: #A7C7E7;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .nav-back:hover {
            background: rgba(192, 192, 192, 0.2);
            border-color: rgba(192, 192, 192, 0.5);
            color: #C0C0C0;
        }

        .info-panel {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            background: rgba(5, 15, 32, 0.95);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            max-width: 320px;
            font-size: 0.85rem;
        }

        .info-panel p {
            margin-bottom: 0.5rem;
            color: #A7C7E7;
            line-height: 1.4;
        }

        .info-panel strong {
            color: #007BFF;
            display: block;
            margin-top: 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1024px) {
            .ui-panel {
                top: auto;
                right: auto;
                bottom: 2rem;
                left: 2rem;
                min-width: 100%;
                max-width: 400px;
            }

            .info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Navigation -->
    <a href="index.html" class="nav-back">← Back to Playground</a>

    <!-- UI Panel (lil-gui will mount here) -->
    <div class="ui-panel" id="ui-container"></div>

    <!-- Info Panel -->
    <div class="info-panel">
        <p><strong>Hero C: Dimensional Type</strong></p>
        <p>3D "DINA DYNAMICS" typography with real TextGeometry, beveled edges, and glitter material.</p>
        <p><strong>Features:</strong> FontLoader, TextGeometry, PBR material, responsive rotation, cinematic lighting.</p>
    </div>

    <!-- Three.js and Dependencies -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@r170",
        "three/addons/": "https://esm.sh/three@r170/examples/jsm/",
        "lil-gui": "https://esm.sh/lil-gui@0.20.0"
      }
    }
    </script>

    <!-- Main Application -->
    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'lil-gui';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { PMREMGenerator } from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const config = {
            theme: 'electric-cobalt',
            metalness: 1.0,
            roughness: 0.1,
            clearcoat: 0.95,
            clearcoatRoughness: 0.05,
            autoRotate: false,
            rotationSpeed: 0.3,
            bloomIntensity: 1.5,
            bloomThreshold: 0.85,
            bloomScale: 0.4
        };

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, canvas });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        camera.position.set(0, 0, 8);
        scene.background = new THREE.Color('#050F20');

        // Environment
        const pmremGenerator = new PMREMGenerator(renderer);
        const environment = new RoomEnvironment();
        const envMap = pmremGenerator.fromScene(environment).texture;
        scene.environment = envMap;

        // Lighting - 5-point setup
        const keyLight = new THREE.DirectionalLight(0xFFFFFF, 2.0);
        keyLight.position.set(5, 10, 7);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x70B9FF, 1.0);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const ambientLight = new THREE.AmbientLight(0x1a2a4a, 0.3);
        scene.add(ambientLight);

        const rimLight = new THREE.PointLight(0x007BFF, 1.5);
        rimLight.position.set(0, 0, 10);
        scene.add(rimLight);

        // Text
        let textMesh = null;
        const fontLoader = new FontLoader();
        const fontUrl = 'https://cdn.jsdelivr.net/npm/three@r170/examples/fonts/helvetiker_bold.typeface.json';

        fontLoader.load(fontUrl, (font) => {
            const geometry = new TextGeometry('DINA DYNAMICS', {
                font: font,
                size: 1.0,
                height: 0.3,
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.08,
                bevelSize: 0.04,
                bevelSegments: 3
            });

            geometry.center();

            const material = new THREE.MeshPhysicalMaterial({
                color: '#C0C0C0',
                metalness: config.metalness,
                roughness: config.roughness,
                clearcoat: config.clearcoat,
                clearcoatRoughness: config.clearcoatRoughness,
                envMapIntensity: 1.5,
                emissive: '#007BFF',
                emissiveIntensity: 0.15
            });

            textMesh = new THREE.Mesh(geometry, material);
            scene.add(textMesh);
        });

        // Mouse tracking
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Post-processing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            config.bloomIntensity,
            config.bloomScale,
            config.bloomThreshold
        );
        composer.addPass(bloomPass);

        // GUI
        const gui = new GUI({ container: document.getElementById('ui-container') });
        gui.title('Hero C: Dimensional Type');

        const matFolder = gui.addFolder('Material Properties');
        matFolder.add(config, 'metalness', 0, 1, 0.01).onChange((v) => {
            if (textMesh && textMesh.material) textMesh.material.metalness = v;
        });
        matFolder.add(config, 'roughness', 0, 1, 0.01).onChange((v) => {
            if (textMesh && textMesh.material) textMesh.material.roughness = v;
        });
        matFolder.add(config, 'clearcoat', 0, 1, 0.01).onChange((v) => {
            if (textMesh && textMesh.material) textMesh.material.clearcoat = v;
        });
        matFolder.add(config, 'clearcoatRoughness', 0, 1, 0.01).onChange((v) => {
            if (textMesh && textMesh.material) textMesh.material.clearcoatRoughness = v;
        });

        const controlFolder = gui.addFolder('Animation');
        controlFolder.add(config, 'autoRotate');
        controlFolder.add(config, 'rotationSpeed', 0, 2, 0.1);

        const bloomFolder = gui.addFolder('Post-Processing');
        bloomFolder.add(config, 'bloomIntensity', 0, 5, 0.1).onChange((v) => {
            bloomPass.strength = v;
        });
        bloomFolder.add(config, 'bloomThreshold', 0, 1, 0.05).onChange((v) => {
            bloomPass.threshold = v;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (textMesh) {
                // Mouse-responsive rotation
                textMesh.rotation.x = mouseY * 0.3;
                textMesh.rotation.y = mouseX * 0.3;

                // Auto rotation
                if (config.autoRotate) {
                    textMesh.rotation.y += config.rotationSpeed * 0.01;
                }

                // Gentle bob
                textMesh.position.y = Math.sin(Date.now() * 0.0005) * 0.2;
            }

            composer.render();
        }

        animate();
    </script>
</body>
</html>
