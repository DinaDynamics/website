<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero C: Dimensional Type — Dina Dynamics</title>
    <link rel="stylesheet" href="playground-foundation.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            padding-bottom: 6rem;
        }

        .hero-content {
            text-align: center;
            max-width: 900px;
            padding: 0 2rem;
        }

        .hero-tagline {
            font-size: 1.3rem;
            color: var(--accent-light);
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeInUp 1.6s ease-out 0.4s both;
        }

        .hero-cta-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1.6s ease-out 0.6s both;
        }

        .hero-cta {
            pointer-events: auto;
            padding: 1.2rem 2.8rem;
            font-size: 0.9rem;
            font-weight: 700;
            border: 2px solid var(--accent-primary);
            background: rgba(0, 123, 255, 0.1);
            color: var(--accent-primary);
            cursor: pointer;
            transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            border-radius: 2px;
        }

        .hero-cta:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 40px rgba(0, 123, 255, 0.7),
                       inset 0 0 20px rgba(0, 123, 255, 0.3);
            transform: translateY(-3px) scale(1.05);
        }

        .hero-cta.secondary {
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            background: transparent;
        }

        .hero-cta.secondary:hover {
            background: var(--text-secondary);
            color: var(--bg-primary);
            border-color: var(--text-secondary);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-top {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            pointer-events: auto;
        }

        .nav-top a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 200ms ease;
        }

        .nav-top a:hover {
            color: var(--accent-primary);
        }

        .theme-switcher {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10000;
            background: rgba(10, 26, 48, 0.9);
            border: 1px solid rgba(192, 192, 192, 0.2);
            border-radius: 8px;
            padding: 1rem;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }

        .theme-switcher label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }

        .theme-switcher select {
            width: 100%;
            background: var(--accent-deep);
            color: var(--text-primary);
            border: 1px solid var(--accent-primary);
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .theme-switcher select:hover {
            background: var(--accent-primary);
        }

        @media (max-width: 768px) {
            .hero-tagline {
                font-size: 1rem;
            }

            .hero-cta-group {
                gap: 1rem;
            }

            .hero-cta {
                padding: 1rem 2rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Hero Overlay Content -->
    <div class="hero-overlay">
        <div class="hero-content">
            <p class="hero-tagline">Advanced Maritime Autonomy for Defense</p>
            <div class="hero-cta-group">
                <button class="hero-cta">Learn Platform</button>
                <button class="hero-cta secondary">Get In Touch</button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-top">
        <a href="material-playground.html">← Material Lab</a>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <label for="theme-switcher">Theme</label>
        <select id="theme-switcher">
            <option value="electric-cobalt" selected>Electric Cobalt</option>
            <option value="imperial-sapphire">Imperial Sapphire</option>
            <option value="arctic-steel">Arctic Steel</option>
            <option value="deep-atlantic">Deep Atlantic</option>
            <option value="midnight-titanium">Midnight Titanium</option>
        </select>
    </div>

    <!-- Three.js and Scripts -->
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js';
        import { applyTheme, getCurrentTheme, hexToRGBNormalized } from './theme-config.js';

        // Apply default theme
        applyTheme('electric-cobalt');

        /**
         * Hero C: Dimensional Typography
         * 3D text "DINA DYNAMICS" with glitter material and dramatic lighting
         */
        class DimensionalTypeHero {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 0, 8);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);

                this.updateSceneColors();
                this.setupLighting();
                this.createTextGeometry();
                this.setupEventListeners();

                this.mouseX = 0;
                this.mouseY = 0;
                this.time = 0;

                this.animate();
            }

            updateSceneColors() {
                const theme = getCurrentTheme();
                this.scene.background = new THREE.Color(theme.darkBg);
            }

            setupLighting() {
                // Key light - dramatic angle
                const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.6);
                keyLight.position.set(15, 20, 15);
                this.scene.add(keyLight);

                // Fill light - accent color
                const fillLight = new THREE.DirectionalLight(0x007BFF, 0.8);
                fillLight.position.set(-15, -10, -15);
                this.scene.add(fillLight);

                // Rim light - blue glow
                const rimLight = new THREE.DirectionalLight(0x70B9FF, 0.9);
                rimLight.position.set(0, 0, 20);
                this.scene.add(rimLight);

                // Ambient
                const ambientLight = new THREE.AmbientLight(0x1a2a4a, 0.4);
                this.scene.add(ambientLight);

                // Point light for extra glitter response
                const pointLight = new THREE.PointLight(0x007BFF, 1.2);
                pointLight.position.set(10, 10, 10);
                this.scene.add(pointLight);
            }

            createTextGeometry() {
                // Create canvas-based text since we don't have a font file
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Fill with theme color
                ctx.fillStyle = getCurrentTheme().darkBg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw text
                ctx.fillStyle = getCurrentTheme().silver;
                ctx.font = 'bold 320px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('DINA', canvas.width / 2 - 300, canvas.height / 2);
                ctx.fillText('DYNAMICS', canvas.width / 2 + 300, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                texture.magFilter = THREE.LinearFilter;
                texture.minFilter = THREE.LinearMipmapLinearFilter;

                // Create plane with text
                const geometry = new THREE.PlaneGeometry(16, 4, 32, 32);

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    color: new THREE.Color(getCurrentTheme().silver),
                    metalness: 1.0,
                    roughness: 0.08,
                    emissive: new THREE.Color(getCurrentTheme().accentPrimary),
                    emissiveIntensity: 0.3,
                    envMapIntensity: 1.5,
                    side: THREE.DoubleSide
                });

                this.textMesh = new THREE.Mesh(geometry, material);
                this.textMesh.castShadow = true;
                this.textMesh.receiveShadow = true;
                this.textMesh.userData.baseRotation = { x: 0, y: 0, z: 0 };

                // Add beveled edge geometry for depth
                this.createBeveledEdges();

                this.scene.add(this.textMesh);
            }

            createBeveledEdges() {
                // Create subtle beveled edges using small planes
                const edgeGeometry = new THREE.BoxGeometry(16, 4, 0.2, 16, 4, 1);
                const edgeMaterial = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(getCurrentTheme().silver),
                    metalness: 0.95,
                    roughness: 0.15,
                    emissive: new THREE.Color(getCurrentTheme().accentPrimary),
                    emissiveIntensity: 0.2
                });

                const edges = new THREE.Mesh(edgeGeometry, edgeMaterial);
                edges.position.z = 0.15;
                this.scene.add(edges);
            }

            setupEventListeners() {
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                });

                window.addEventListener('resize', () => this.onWindowResize());

                document.getElementById('theme-switcher').addEventListener('change', (e) => {
                    applyTheme(e.target.value);
                    this.updateSceneColors();
                });
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate = () => {
                requestAnimationFrame(this.animate);
                this.time += 0.016;

                // Responsive rotation based on mouse
                this.textMesh.rotation.x = this.mouseY * 0.5;
                this.textMesh.rotation.y = this.mouseX * 0.8;

                // Gentle continuous rotation
                this.textMesh.rotation.z += 0.0003;

                // Subtle bob effect
                this.textMesh.position.y = Math.sin(this.time * 0.5) * 0.3;

                this.renderer.render(this.scene, this.camera);
            };
        }

        // Initialize
        const hero = new DimensionalTypeHero();
    </script>
</body>
</html>
