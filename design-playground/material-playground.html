<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Playground — Dina Dynamics</title>
    <link rel="stylesheet" href="playground-foundation.css">
    <style>
        /* Additional playground-specific styles */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
        }

        .theme-switcher {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 220px;
        }

        .theme-switcher label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }

        .theme-switcher select {
            width: 100%;
        }

        .preset-selector {
            border-top: 1px solid var(--border-subtle);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .info-panel {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: var(--surface-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 300px;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
        }

        .info-panel h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--accent-primary);
        }

        .info-item {
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        .info-label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .theme-switcher {
                min-width: auto;
                width: auto;
            }

            .info-panel {
                bottom: 1rem;
                left: 1rem;
                max-width: 250px;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Theme & Material Switcher -->
    <div class="theme-switcher">
        <div>
            <label for="theme-switcher">Color Palette</label>
            <select id="theme-switcher">
                <option value="electric-cobalt">Electric Cobalt (Default)</option>
                <option value="imperial-sapphire">Imperial Sapphire</option>
                <option value="arctic-steel">Arctic Steel</option>
                <option value="deep-atlantic">Deep Atlantic</option>
                <option value="midnight-titanium">Midnight Titanium</option>
            </select>
        </div>

        <div class="preset-selector">
            <label for="preset-switcher">Glitter Material</label>
            <select id="preset-switcher">
                <option value="silver-chunky">Silver Chunky Glitter</option>
                <option value="silver-fine">Silver Fine Glitter</option>
                <option value="silver-mixed">Silver Mixed Glitter</option>
                <option value="cobalt-glitter">Cobalt Glitter</option>
                <option value="polished-metal">Polished Metal</option>
            </select>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
        <h3>Material Playground</h3>
        <div class="info-item">
            <div class="info-label">Controls</div>
            <p>Use dropdowns to explore different palettes and glitter materials. Watch the 3D sphere respond to lighting and material properties.</p>
        </div>
        <div class="info-item">
            <div class="info-label">Theme</div>
            <p id="theme-name">Electric Cobalt</p>
        </div>
        <div class="info-item">
            <div class="info-label">Material</div>
            <p id="material-name">Silver Chunky Glitter</p>
        </div>
    </div>

    <!-- Three.js Library -->
    <script type="module" src="js/playground.js"></script>
    
    <!-- Theme Configuration (global) -->
    <script type="module">
        import { applyTheme, THEMES } from './theme-config.js';
        
        // Apply default theme on load
        applyTheme('electric-cobalt');
        
        // Update info panel on theme change
        document.getElementById('theme-switcher').addEventListener('change', (e) => {
            const themeName = e.target.value;
            const theme = THEMES[themeName];
            document.getElementById('theme-name').textContent = theme.name;
        });

        document.getElementById('preset-switcher').addEventListener('change', (e) => {
            const presetLabels = {
                'silver-chunky': 'Silver Chunky Glitter',
                'silver-fine': 'Silver Fine Glitter',
                'silver-mixed': 'Silver Mixed Glitter',
                'cobalt-glitter': 'Cobalt Glitter',
                'polished-metal': 'Polished Metal'
            };
            document.getElementById('material-name').textContent = presetLabels[e.target.value];
        });
    </script>
</body>
</html>
